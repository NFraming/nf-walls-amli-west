<title>NF WALLS · AMLI Mueller V (West)</title>
<style>
:root{--nf:#0a4fb4;--nf2:#1a73e8;--nfd:#073a85;--bg:#eef4fc;--card:#ffffff;--line:#c9d9ef;--txt:#14233a;--muted:#4a5d78;--ok:#0e7490;--flag:#0b5cad;--soft:#e3eefc;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.hdr{position:sticky;top:0;z-index:20;background:var(--nf);color:#fff;padding:env(safe-area-inset-top,0) 0 0 0;box-shadow:0 2px 6px rgba(7,58,133,.35)}
.hdr .row{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:56px}
.hdr .logo{flex:0 0 auto;height:38px;width:38px;display:block;background:#fff;border-radius:9px;padding:3px}
.hdr .back{flex:0 0 auto;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);border-radius:10px;padding:10px 12px;font-weight:600;min-height:44px}
.hdr .ttl{flex:1 1 auto;min-width:0}
.hdr .updbar{display:flex;justify-content:flex-end;padding:4px 12px 0}
.hdr .upd{border:1.5px solid #fff;border-radius:6px;padding:1px 8px;font-size:11px;line-height:1.35;font-weight:700;letter-spacing:.3px;white-space:nowrap;background:rgba(255,255,255,.14)}
.hdr .upd i{font-style:normal;font-weight:400;margin-left:4px}
.hdr .ttl .t1{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl .t2{font-size:12.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .stripe{height:5px;width:100%;background:var(--nf2)}
.wrap{padding:12px 12px 90px 12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px 0}
.card h2{font-size:15px;margin:0 0 8px 0;color:var(--nf);text-transform:uppercase;letter-spacing:.03em}
.card h2 small{display:block;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);font-size:12.5px}
.title-card{background:var(--nf);color:#fff;border:0}
.title-card .big{font-size:21px;font-weight:800;line-height:1.2}
.title-card .sub{font-size:13.5px;opacity:.95;margin-top:6px}
.title-card .meta{font-size:12px;opacity:.85;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:#fff;border:2px solid var(--line);border-left:8px solid var(--nf2);border-radius:12px;padding:12px;min-height:104px;text-align:left;box-shadow:0 1px 2px rgba(7,58,133,.08)}
.sbtn:active{background:var(--soft)}
.sbtn .ic{font-size:24px;font-weight:800;color:var(--nf);line-height:1}
.sbtn .n{font-weight:800;font-size:17px;color:var(--nfd)}
.sbtn .b{font-size:12px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--nf2);color:#fff;border-radius:12px;padding:13px 14px;font-weight:700;min-height:48px;width:100%;text-align:center}
.btn.sec{background:#fff;color:var(--nf);border:2px solid var(--nf2)}
.btn:active{filter:brightness(.92)}
.viewer{position:relative;width:100%;height:58vh;min-height:300px;background:#dbe6f5;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;user-select:none}
.viewer.tall{height:88vh !important}
.viewer img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none;max-width:none}
.viewer .tapwrap{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.viewer .ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:5}
.viewer .ctl button{width:44px;height:44px;border-radius:10px;background:var(--nf);color:#fff;font-size:20px;font-weight:700;box-shadow:0 1px 4px rgba(7,58,133,.4)}
.viewer .ctl button.wide{width:auto;padding:0 12px;font-size:13px}
.viewer .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#243b5a;font-weight:600;background:#dbe6f5}
.tabs{display:flex;gap:6px;margin:0 0 8px 0;flex-wrap:wrap}
.tab{flex:1 1 auto;min-height:40px;border-radius:10px;border:2px solid var(--nf2);color:var(--nf);font-weight:700;padding:6px 10px;background:#fff}
.tab.on{background:var(--nf2);color:#fff}
.item{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-left:8px solid var(--nf2);border-radius:12px;padding:10px;margin:0 0 10px 0;box-shadow:0 1px 2px rgba(7,58,133,.06);width:100%;text-align:left}
.item:active{background:var(--soft)}
.item .body{flex:1 1 auto;min-width:0}
.item .id{font-weight:800;font-size:16px;color:var(--nfd)}
.item .nm{font-size:13px;color:var(--muted);margin-top:1px}
.item .rev{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--nf);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.item .rev.flag{background:var(--nf);color:#fff;border-color:var(--nf)}
.item .go{flex:0 0 auto;align-self:center;font-size:22px;color:var(--nf2);font-weight:800}
.fam{font-size:13px;font-weight:800;color:var(--nf);margin:14px 2px 6px 2px;text-transform:uppercase;letter-spacing:.03em}
.fam:first-child{margin-top:0}
.nav2{display:flex;gap:10px;margin-top:4px}
.nav2 .btn{flex:1 1 0}
.hint{font-size:12.5px;color:var(--muted);margin:8px 2px 0 2px}
.meta2{font-size:12.5px;color:var(--muted);margin:2px 0 8px 0;word-break:break-word}
.pend{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:2px dashed var(--nf2);border-radius:10px;margin:0 0 8px 0;background:var(--soft)}
.pend b{color:var(--nfd)}
.pend span.es{display:block;color:var(--muted);font-size:12.5px}
.tag{flex:0 0 auto;font-size:11px;font-weight:800;color:#fff;background:var(--nf);border-radius:6px;padding:2px 7px;margin-top:1px}
.foot{font-size:11.5px;color:var(--muted);text-align:center;margin:12px 0 0 0}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0)) 8px;gap:4px}
.bottombar button{flex:1 1 0;min-height:48px;border-radius:10px;font-weight:700;font-size:12.5px;color:var(--nf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.bottombar button.on{background:var(--soft)}
.bottombar button span{font-size:10.5px;font-weight:500;color:var(--muted)}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}

.inst{background:#fff;border:3px solid var(--nf);border-radius:16px;padding:14px;margin:12px 0}
.inst .ibtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--nf);color:#fff;border:0;border-radius:14px;padding:16px 12px;font-size:19px;font-weight:800;min-height:58px;cursor:pointer}
.inst .ibtn small{display:block;font-size:13px;font-weight:600;opacity:1}
.inst .ibtn:active{filter:brightness(.9)}
.inst .ok{background:var(--soft);color:var(--nfd);border:2px solid var(--nf2);border-radius:12px;padding:12px;font-weight:800;text-align:center}
.inst .steps{display:none;margin-top:12px;background:var(--soft);border-radius:12px;padding:12px;color:var(--txt);font-size:15px;line-height:1.45}
.inst .steps.show{display:block}
.inst .steps b{color:var(--nfd)}
.inst .steps ol{margin:6px 0 8px 20px;padding:0}
.inst .steps .es{color:var(--muted);display:block;margin-bottom:6px}
.inst .cp{margin-top:10px;width:100%;background:#fff;color:var(--nf);border:2px solid var(--nf2);border-radius:12px;padding:12px;font-weight:700;font-size:15px;min-height:46px;cursor:pointer}
.inst .why{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}

.hbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:var(--nf);border:3px solid var(--nf);border-radius:14px;padding:13px 12px;font-size:17px;font-weight:800;min-height:54px;cursor:pointer;margin:0 0 12px 0}
.hbtn small{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.hbtn:active{filter:brightness(.93)}
.how .st{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px 0}
.how .st .hd{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.how .st .num{flex:0 0 38px;height:38px;border-radius:50%;background:var(--nf);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.how .st .t{font-weight:800;font-size:17px;color:var(--nfd);line-height:1.15}
.how .st .t small{display:block;font-weight:600;font-size:13px;color:var(--muted)}
.how .st p{margin:6px 0;font-size:14.5px;line-height:1.4;color:var(--txt)}
.how .st p i{color:var(--muted)}
.how .st img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin-top:8px}
.how .air{background:var(--soft);border:2px dashed var(--nf2);border-radius:12px;padding:14px;text-align:center;margin-top:8px;font-weight:800;color:var(--nfd);font-size:16px}
.how .air span{display:block;font-size:34px;line-height:1.1}

/* update 2 */
.hdr .upd{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;min-height:30px;cursor:pointer;font-size:12px}
.hdr .upd:active{background:rgba(255,255,255,.3)}
.hdr .updbar{padding-bottom:2px}
.vdot{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid #fff;background:#facc15;flex:0 0 auto}
.vdot.g{background:#22c55e}.vdot.r{background:#ef4444}
.lvb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-left:8px solid var(--nf2);border-radius:14px;padding:10px 12px;margin:0 0 10px 0;min-height:70px;box-shadow:0 1px 2px rgba(7,58,133,.08)}
.lvb:active{background:var(--soft)}
.lvb .num{flex:0 0 52px;height:52px;border-radius:12px;background:var(--nf);color:#fff;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center}
.lvb .tx{flex:1 1 auto;min-width:0}
.lvb .n{font-weight:800;font-size:17px;color:var(--nfd)}
.lvb .b{font-size:12.5px;color:var(--muted)}
.lvb .go{font-size:24px;color:var(--nf2);font-weight:800}
.lvb.empty .num{background:#fff;color:var(--nf);border:2px dashed var(--nf2)}
.typebar{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.typebar button{flex:1 1 auto;min-height:44px;border:2px solid var(--nf2);border-radius:10px;color:var(--nf);font-weight:700;background:#fff;padding:6px 10px;font-size:14px}
.slot{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin:0 0 12px 0}
.slot .sh{display:flex;align-items:center;gap:8px;margin:0 0 8px 0}
.slot .s1{flex:1 1 auto;font-weight:800;font-size:16px;color:var(--nfd);line-height:1.15}
.slot .s1 small{display:block;font-weight:600;font-size:12.5px;color:var(--muted)}
.bdg{flex:0 0 auto;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px}
.bdg.ok{background:var(--nf);color:#fff}
.bdg.pe{background:#fff;color:var(--nf);border:2px dashed var(--nf2)}
.lvit{border:1px solid var(--line);border-left:8px solid var(--nf2);border-radius:12px;margin:0 0 8px 0;background:#fff;overflow:hidden}
.lvit .item{border:0;border-radius:0;margin:0;box-shadow:none;border-left:0}
.lvit .all{display:inline-block;margin-top:6px;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--nfd);background:#fff;border:1px solid var(--nf2);border-radius:999px;padding:2px 9px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 10px 10px 10px}
.chips span{flex:0 0 100%;font-size:12px;font-weight:700;color:var(--muted)}
.chip{min-height:40px;min-width:48px;border-radius:10px;border:2px solid var(--nf2);color:var(--nf);font-weight:800;padding:4px 12px;background:#fff;font-size:14px}
.chip:active{background:var(--soft)}
.vstat{border:3px solid var(--nf);border-radius:16px;padding:14px;background:#fff;margin:0 0 12px 0}
.vstat .big{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--nfd)}
.vstat .big .vdot{width:22px;height:22px;border-width:3px;border-color:var(--nfd)}
.vstat p{margin:8px 0 0 0;font-size:14px;color:var(--txt)}
.vstat p i{color:var(--muted)}
.vstat .ubtn{margin-top:12px;display:block;width:100%;background:var(--nf);color:#fff;border-radius:12px;padding:14px;font-weight:800;font-size:16px;min-height:52px}
.vstat .ubtn:disabled{opacity:.7}
.vkey{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:13px;color:var(--txt)}
.vkey div{display:flex;align-items:center;gap:8px}
.vkey .vdot{border-color:var(--nfd)}
.vrow{background:#fff;border:1px solid var(--line);border-left:8px solid var(--nf2);border-radius:12px;padding:10px;margin:0 0 10px 0}
.vrow.cur{border-left-color:var(--nf);background:var(--soft)}
.vrow .vh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vrow .vn{font-weight:800;font-size:16px;color:var(--nfd)}
.vrow .vd{font-size:12.5px;color:var(--muted)}
.vrow .me{font-size:11px;font-weight:800;color:#fff;background:var(--nf);border-radius:6px;padding:2px 7px}
.vrow ul{margin:6px 0 0 18px;padding:0;font-size:13.5px}
.vrow li i{color:var(--muted)}
</style>
</head>

function makeViewer(el, srcKey, opts){

  const ctl=document.createElement('div'); ctl.className='ctl';
  ctl.innerHTML='<button class="wide" data-a="fit" title="Fit">FIT</button><button data-a="minus">−</button><button data-a="plus">+</button><button class="wide" data-a="tall">⤢</button>';
  let scale=1,minS=1,tx=0,ty=0,iw=0,ih=0,cw=0,ch=0;
  const CTRL_RESERVE=60; /* px reserved at the bottom of the viewer so the FIT/-/+/expand controls never sit on top of the sheet (table/notes); fit() treats this as outside the usable image area, and clamp() uses the same ch, so panning can never slide content under the controls either. */

       scroll the page normally (pan-y) instead of trapping the gesture. Only once the user has

       was behind the "zoom and scroll down" complaint: the viewer used to swallow every touch at

  function fit(){ cw=el.clientWidth; ch=Math.max(el.clientHeight-CTRL_RESERVE,120); minS=Math.min(cw/iw,ch/ih); scale=minS; clamp(); apply(); }
  function zoomAt(f,x,y){ const ns=Math.max(minS,Math.min(scale*f,Math.max(minS*10,8))); const r=ns/scale; tx=x-(x-tx)*r; ty=y-(y-ty)*r; scale=ns; clamp(); apply(); }
  img.onload=()=>{ iw=img.naturalWidth; ih=img.naturalHeight; el.innerHTML=''; el.appendChild(img);
    if(opts.taps && opts.taps.length){ ov.style.width=iw+'px'; ov.style.height=ih+'px'; ov.innerHTML='';
      opts.taps.forEach(t=>{ const b=document.createElement('button'); b.className='tap';
        b.style.left=(t.x0*100)+'%'; b.style.top=(t.y0*100)+'%'; b.style.width=((t.x1-t.x0)*100)+'%'; b.style.height=((t.y1-t.y0)*100)+'%';

        ov.appendChild(b); });

    el.appendChild(ctl);
    if(!el.classList.contains('tall')){ const cwid=el.clientWidth; el.style.height=Math.round(Math.min(Math.max(cwid*ih/iw,260),window.innerHeight*0.80))+'px'; }
    fit();

  el.addEventListener('pointerdown',e=>{ try{ el.setPointerCapture(e.pointerId); }catch(err){} ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; downPt={x:e.clientX,y:e.clientY};
    if(ptrs.size===2){ const a=[...ptrs.values()]; pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y), mx:(a[0].x+a[1].x)/2, my:(a[0].y+a[1].y)/2}; e.preventDefault(); }

     : `<b>Open this link in Safari first</b><span class="es">Primero abre este enlace en Safari (no en Telegram)</span><ol><li>Tap <b>Copy link</b> below.<br><i>Toca <b>Copiar enlace</b>.</i></li><li>Open <b>Safari</b>, paste in the address bar, go.<br><i>Abre <b>Safari</b>, pega en la barra y entra.</i></li><li>Then tap <b>DOWNLOAD APP</b> again.<br><i>Luego toca <b>DESCARGAR APP</b> otra vez.</i></li></ol>`;
  } else {
    html = `<b>Android – 3 steps (use Chrome)</b><span class="es">Android – 3 pasos (usa Chrome)</span><ol><li>Open this link in <b>Chrome</b> (not inside Telegram). Tap <b>Copy link</b> if needed.<br><i>Abre este enlace en <b>Chrome</b> (no dentro de Telegram). Toca <b>Copiar enlace</b> si hace falta.</i></li><li>Tap the menu <b>⋮</b> (top right) → <b>Install app</b> or <b>Add to Home screen</b>.<br><i>Toca el menú <b>⋮</b> (arriba a la derecha) → <b>Instalar app</b> o <b>Agregar a pantalla de inicio</b>.</i></li><li>Tap <b>Install</b>. Look for the blue NF WALLS icon on your home screen / app drawer.<br><i>Toca <b>Instalar</b>. Busca el ícono azul NF WALLS en tu pantalla de inicio o cajón de apps.</i></li></ol>`;
  }
  const s=document.getElementById('nfSteps'); if(!s) return;
  s.innerHTML=html+`<button class="cp" id="nfCp" onclick="nfCopy()">Copy link · Copiar enlace</button>`; s.classList.add('show'); s.scrollIntoView({behavior:'smooth',block:'nearest'}); }


/* ---------- how it works ---------- */
function howCard(){ return `<button class="hbtn" onclick="go('#how')"><span style="font-size:24px">❓</span><span>HOW IT WORKS<small>CÓMO FUNCIONA – 5 simple steps / 5 pasos</small></span></button>`; }
function renderHow(app){ setBB('home');
  const st=(n,en,es,pen,pes,img,extra)=>`<div class="st"><div class="hd"><div class="num">${n}</div><div class="t">${en}<small>${es}</small></div></div><p>${pen}</p><p><i>${pes}</i></p>${img?`<img src="img/${img}.webp" alt="${en}">`:''}${extra||''}</div>`;
  app.innerHTML=header({label:'Home',fn:"go('#home')"},'How it works','Cómo funciona') + `<div class="wrap how">
  <div class="card"><h2>5 simple steps <small>5 pasos simples</small></h2><div class="hint" style="margin:0">Red boxes show where to tap. / Los recuadros rojos muestran dónde tocar.</div></div>
  ${st(1,'Install the app','Instala la app','Open the link in <b>Safari</b> (iPhone) or <b>Chrome</b> (Android) – not inside Telegram. Tap <b>DOWNLOAD APP</b> and follow the steps. The blue NF WALLS icon appears on your home screen.','Abre el enlace en <b>Safari</b> (iPhone) o <b>Chrome</b> (Android) – no dentro de Telegram. Toca <b>DESCARGAR APP</b> y sigue los pasos. El ícono azul NF WALLS aparece en tu pantalla de inicio.','how1')}
  ${st(2,'Pick a level','Elige un nivel','Tap Level 3, 4, 5, 6 or 7. Each level lists its formats: Control Lines, Wall Layout, Wall Panel Layout, Shear Walls, Window Straps, Millwork.','Toca Nivel 3, 4, 5, 6 o 7. Cada nivel muestra sus formatos: Control Lines, Wall Layout, Wall Panel Layout, Shear Walls, Window Straps, Millwork.','how2')}
  ${st(3,'Open the full plan or a section','Abre el plano completo o una sección','Tap the sheet card for the <b>full plan</b>. Under it, tap <b>A, B, C…</b> to jump to one section. Each card shows only the <b>latest revision</b>.','Toca la tarjeta para el <b>plano completo</b>. Debajo, toca <b>A, B, C…</b> para ir a una sección. Cada tarjeta muestra solo la <b>revisión más reciente</b>.','how3')}
  ${st(4,'Zoom and move','Acerca y mueve','<b>Pinch</b> to zoom, <b>drag</b> to move, <b>double-tap</b> to zoom in. Use <b>FIT</b> to see the full sheet. Use the tabs when a sheet has several areas.','<b>Pellizca</b> para acercar, <b>arrastra</b> para mover, <b>doble toque</b> para acercar. <b>FIT</b> muestra la hoja completa. Usa las pestañas cuando hay varias áreas.','how4')}
  ${st(5,'Use it with no signal','Úsala sin señal','Open the app <b>once with signal</b> and wait for Home. After that it works offline. Test: turn on airplane mode and open a sheet.','Abre la app <b>una vez con señal</b> y espera a que cargue Home. Después funciona sin internet. Prueba: activa modo avión y abre una hoja.',null,'<div class="air"><span>✈</span>Airplane mode ON – still works<br><small style="font-weight:600;color:var(--muted)">Modo avión – sigue funcionando</small></div>')}
  <div class="card"><h2>UPDATE button <small>Botón de versión (arriba a la derecha)</small></h2><div class="hint" style="margin:0">Tap <b>UPDATE</b> at the top right. <b>Green</b> dot = latest version. <b>Yellow</b> = cannot check (no signal). <b>Red</b> = new version, tap UPDATE NOW. / Toca <b>UPDATE</b> arriba a la derecha. Punto <b>verde</b> = última versión. <b>Amarillo</b> = no se puede verificar (sin señal). <b>Rojo</b> = versión nueva, toca ACTUALIZAR.</div></div>
  <div class="card"><h2>PENDING <small>Pendiente</small></h2><div class="hint" style="margin:0">A card marked <b>PENDING</b> means that sheet is not in the app yet. / Una tarjeta <b>PENDING</b> significa que esa hoja todavía no está en la app.</div></div>
  <button class="btn" onclick="go('#home')">◀ Home · Inicio</button></div>`; }


/* ---------- update 2 ---------- */
const NF_BUILD=200;
const SLOTS=[['cl','Control Lines','Líneas de control'],['lay','Wall Layout','Layout de muros'],['pan','Wall Panel Layout','Layout de paneles de muro'],['sw','Shear Walls · Sill Plate','Shear walls · Sill plate'],['str','Window Straps (FTAO)','Straps de ventanas (FTAO)'],['mw','Millwork','Millwork']];
const LEVELS={3:{cl:['cl3'],lay:['l3o','l3u'],sw:['s02c'],str:['str3']},4:{lay:['l4o','l4u'],sw:['s02c','sw4']},5:{lay:['l5o'],sw:['s02c','sw5']},6:{sw:['s02c','sw6']},7:{sw:['s02c']}};
const LGEN=['s02c'];
const LXTRA={
 '3-cl':[['Control lines by unit (sections)','Líneas de control por unidad (secciones)']],
 '3-sw':[['Sill plate connection / shear wall location plan','Conexión de sill plate / plano de ubicación de shear walls']],
 '4-sw':[['Sill plate connection / shear wall location plan','Conexión de sill plate / plano de ubicación de shear walls']],
 '5-sw':[['Sill plate connection / shear wall location plan','Conexión de sill plate / plano de ubicación de shear walls']],
 '6-sw':[['Sill plate connection / shear wall location plan','Conexión de sill plate / plano de ubicación de shear walls']],
 '7-sw':[['Sill plate connection / shear wall location plan','Conexión de sill plate / plano de ubicación de shear walls']],
 /* ---------- update 2 sections ---------- */
  '3-lay':[['Overall layout – split by section','Layout overall – dividido por sección']],
  '4-lay':[['Overall layout – split by section','Layout overall – dividido por sección']],
  '6-lay':[['Layout – overall + by section','Layout – overall + por sección']],
  '7-lay':[['Layout – overall + by section','Layout – overall + por sección']],
  '4-cl':[['Control lines – overall + by section','Líneas de control – overall + por sección']],
  '5-cl':[['Control lines – overall + by section','Líneas de control – overall + por sección']],
  '6-cl':[['Control lines – overall + by section','Líneas de control – overall + por sección']],
  '7-cl':[['Control lines – overall + by section','Líneas de control – overall + por sección']],
  '5-lay':[['Layout Areas A–D','Layout Áreas A–D'],['Overall layout – split by section','Layout overall – dividido por sección']]
};
function lvSlots(L){ return SLOTS.map(s=>({k:s[0],t:s[1],es:s[2],ids:(LEVELS[L]||{})[s[0]]||[]})); }
function lvFlat(L){ const a=[]; lvSlots(L).forEach(s=>s.ids.forEach(i=>{ if(a.indexOf(i)<0) a.push(i); })); return a; }
function lvCount(L){ return lvSlots(L).filter(s=>s.ids.some(i=>LGEN.indexOf(i)<0)).length; }
function lvSheets(L){ return lvFlat(L).filter(i=>LGEN.indexOf(i)<0).length; }
function pendRow(en,es){ return `<div class="pend"><span class="tag">PENDING</span><div><b>${esc(en)}</b><span class="es">${esc(es)}</span></div></div>`; }

/* version / update indicator: g = latest, y = cannot check (no signal), r = newer version available */
window.NFV={st:'y',latest:null,at:null};
function vdot(){ return `<i class="vdot ${NFV.st}"></i>`; }
function setDots(){ document.querySelectorAll('.hdr .upd .vdot').forEach(d=>{ d.className='vdot '+NFV.st; }); const s=document.getElementById('vstat'); if(s) s.innerHTML=verStatus(); }
function checkVer(){ return fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error('x'); return r.json(); }).then(j=>{ NFV.latest=j; NFV.st=(j.b>NF_BUILD)?'r':'g'; NFV.at=Date.now(); try{ localStorage.setItem('nfwalls_chk',String(NFV.at)); }catch(e){} }).catch(()=>{ NFV.st='y'; }).then(setDots); }
window.addEventListener('online',checkVer);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkVer(); });
function lastChk(){ let t=NFV.at; if(!t){ try{ t=parseInt(localStorage.getItem('nfwalls_chk')||'0',10)||null; }catch(e){} } return t?new Date(t).toLocaleString():null; }
function verStatus(){
  const U=DATA.upd, lc=lastChk();
  if(NFV.st==='g') return `<div class="big"><i class="vdot g"></i>Up to date · Actualizada</div><p>You have the latest version (${esc(U.v)}).</p><p><i>Tienes la última versión (${esc(U.v)}).</i></p>`;
  if(NFV.st==='r') return `<div class="big"><i class="vdot r"></i>New version available · Hay versión nueva</div><p>Version ${esc(NFV.latest&&NFV.latest.v||'')} is ready. You have ${esc(U.v)}. Tap UPDATE with signal and keep the app open.</p><p><i>La versión ${esc(NFV.latest&&NFV.latest.v||'')} está lista. Tienes la ${esc(U.v)}. Toca ACTUALIZAR con señal y deja la app abierta.</i></p><button class="ubtn" id="nfUpd" onclick="nfUpdate()">UPDATE NOW · ACTUALIZAR</button>`;
  return `<div class="big"><i class="vdot y"></i>Cannot check now · No se puede verificar</div><p>No signal, so the app cannot tell if there is a newer version. You have version ${esc(U.v)}. It still works offline.${lc?' Last check: '+esc(lc)+'.':''}</p><p><i>Sin señal, la app no puede saber si hay versión nueva. Tienes la versión ${esc(U.v)}. Sigue funcionando sin internet.${lc?' Última revisión: '+esc(lc)+'.':''}</i></p>`; }
function nfUpdate(){ const b=document.getElementById('nfUpd'); if(b){ b.disabled=true; b.textContent='Updating… keep the app open with signal · Actualizando… deja la app abierta con señal'; }
  if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistration().then(r=>{ if(r) return r.update(); }).catch(()=>{}); setTimeout(()=>{ const x=document.getElementById('nfUpd'); if(x){ x.disabled=false; x.textContent='Try again · Intentar otra vez'; } },90000); } else { location.reload(); } }
function renderVer(app){ setBB('home');
  const vs=(DATA.versions||[]).slice(0,10);
  app.innerHTML=header({label:'Home',fn:"go('#home')"},'Versions','Versiones') + `<div class="wrap">
  <div class="vstat" id="vstat">${verStatus()}</div>
  <div class="card"><h2>Dot colors <small>Colores del punto</small></h2><div class="vkey"><div><i class="vdot g"></i><span><b>Green</b> – latest version · <i>última versión</i></span></div><div><i class="vdot y"></i><span><b>Yellow</b> – cannot check (no signal) · <i>no se puede verificar (sin señal)</i></span></div><div><i class="vdot r"></i><span><b>Red</b> – newer version available, tap UPDATE · <i>hay versión nueva, toca ACTUALIZAR</i></span></div></div></div>
  <div class="card"><h2>Last ${vs.length} versions <small>Últimas ${vs.length} versiones</small></h2></div>
  ${vs.map(v=>`<div class="vrow ${v.v===DATA.upd.v?'cur':''}"><div class="vh"><span class="vn">v${esc(v.v)} · Update ${esc(v.n)}</span><span class="vd">${esc(v.date)}</span>${v.v===DATA.upd.v?'<span class="me">YOU HAVE THIS · TIENES ESTA</span>':''}</div><ul>${v.items.map(i=>`<li>${esc(i[0])}<br><i>${esc(i[1])}</i></li>`).join('')}</ul></div>`).join('')}
  <button class="btn" onclick="go('#home')">◀ Home · Inicio</button></div>`;
  checkVer(); }

function lvItem(id,L){ const it=ITEM[id]; const cl=it.cl||['Sections','Secciones'];
  const chips=it.imgs.length>1?`<div class="chips"><span>${cl[0]} · ${cl[1]}</span>${it.imgs.map((m,k)=>`<button class="chip" onclick="go('#item--${id}--${k}--${L}')">${esc(m[0])}</button>`).join('')}</div>`:'';
  return `<div class="lvit"><button class="item" onclick="go('#item--${id}--0--${L}')"><div class="body"><div class="id">${esc(it.t)}</div><div class="nm">${esc(it.es)}</div><span class="rev ${it.flag?'flag':''}">${esc(it.rev)}</span>${LGEN.indexOf(id)>=0?'<span class="all">All levels · Todos los niveles</span>':''}</div><span class="go">›</span></button>${chips}</div>`; }
function slotCard(L,s){ const ex=LXTRA[L+'-'+s.k]||[];
  const head=`<div class="sh"><div class="s1">${esc(s.t)}<small>${esc(s.es)}</small></div><span class="bdg ${s.ids.length?'ok':'pe'}">${s.ids.length?(s.ids.length+(s.ids.length>1?' sheets':' sheet')):'PENDING'}</span></div>`;
  let body=s.ids.map(id=>lvItem(id,L)).join('')+ex.map(p=>pendRow(p[0],p[1])).join('');
  if(!s.ids.length&&!ex.length) body=pendRow('Not in the app yet','Todavía no está en la app');
  return `<div class="slot">${head}${body}</div>`; }
function renderLevel(app,L){ setBB('l'+L);
  const n=lvCount(L), tot=SLOTS.length;
  app.innerHTML=header({label:'Home',fn:"go('#home')"},'Level '+L,'Nivel '+L+' · AMLI Mueller V (West)') + `<div class="wrap">
  <div class="card"><h2>Level ${L} <small>Nivel ${L}</small></h2><div class="hint" style="margin:0">${n} of ${tot} formats have sheets. Open the <b>full plan</b>, or jump to one <b>section</b> with the buttons under each sheet.<br>${n} de ${tot} formatos tienen hojas. Abre el <b>plano completo</b> o salta a una <b>sección</b> con los botones debajo de cada hoja.</div></div>
  ${lvSlots(L).map(s=>slotCard(L,s)).join('')}</div>`; }
function levelsCard(){ return `<div class="card"><h2>Levels <small>Niveles – pick one / elige uno</small></h2>${[3,4,5,6,7].map(L=>{ const n=lvCount(L), sh=lvSheets(L); return `<button class="lvb ${sh?'':'empty'}" onclick="go('#lvl--${L}')"><span class="num">${L}</span><span class="tx"><span class="n">Level ${L} · Nivel ${L}</span><br><span class="b">${n} of ${SLOTS.length} formats · ${sh} ${sh===1?'sheet':'sheets'}${sh?'':' – PENDING'}</span></span><span class="go">›</span></button>`; }).join('')}
  <div class="hint" style="margin:6px 2px 6px 2px"><b>Browse by type · Ver por tipo</b></div><div class="typebar">${DATA.sections.map(s=>`<button onclick="go('#sec--${s.id}')">${esc(s.t)}</button>`).join('')}</div></div>`; }
function renderItem(app,it,tab,L){ const s=SEC[it.sec]; const lv=(L&&LEVELS[L])?L:0; setBB(lv?'l'+lv:s.id);
  let list,back; if(lv){ list=lvFlat(lv).map(i=>ITEM[i]); back={label:'Level '+lv,fn:`go('#lvl--${lv}')`}; } else { list=s.items; back={label:s.t,fn:`go('#sec--${s.id}')`}; }
  const q=lv?`--${lv}`:'';
  const i=list.findIndex(x=>x.id===it.id), prev=list[i-1], next=list[i+1];
  const imgs=it.imgs; tab=Math.min(Math.max(tab,0),imgs.length-1); const cl=it.cl||['Sections','Secciones'];
  app.innerHTML=header(back,esc(it.t),esc(it.rev)) + `<div class="wrap">
  <div class="card"><h2>${esc(it.t)} <small>${esc(it.es)}</small></h2>
  <div class="meta2"><b>${esc(it.rev)}</b> · ${esc(it.src)}</div>
  ${imgs.length>1?`<div class="tabs">${imgs.map((m,k)=>`<button class="tab ${k===tab?'on':''}" onclick="go('#item--${it.id}--${k}${q}')">${esc(m[0])}</button>`).join('')}</div>`:''}
  <div class="viewer" id="v"></div>
  <div class="hint">Pinch to zoom, drag to move, double-tap to zoom, ⤢ for full height. / Pellizca para acercar, arrastra para mover, doble toque para acercar, ⤢ pantalla alta.</div>
  ${it.note?`<div class="hint"><b>${esc(it.note)}</b><br>${esc(it.note_es)}</div>`:''}</div>
  <div class="nav2">${prev?`<button class="btn sec" onclick="go('#item--${prev.id}--0${q}')">‹ Prev</button>`:''}${next?`<button class="btn sec" onclick="go('#item--${next.id}--0${q}')">Next ›</button>`:''}</div></div>`;
  makeViewer(document.getElementById('v'),imgs[tab][1],{}); }
checkVer();

render();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('service-worker.js').then(reg=>{ reg.update&&reg.update(); }).catch(()=>{}); let r=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(r) return; r=true; if(window._nfHad) location.reload(); }); window._nfHad=!!navigator.serviceWorker.controller; }); }
</script>
