<title>NF WALLS · AMLI Mueller V (West)</title>
<style>
:root{--nf:#0a4fb4;--nf2:#1a73e8;--nfd:#073a85;--bg:#eef4fc;--card:#ffffff;--line:#c9d9ef;--txt:#14233a;--muted:#4a5d78;--ok:#0e7490;--flag:#0b5cad;--soft:#e3eefc;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.hdr{position:sticky;top:0;z-index:20;background:var(--nf);color:#fff;padding:env(safe-area-inset-top,0) 0 0 0;box-shadow:0 2px 6px rgba(7,58,133,.35)}
.hdr .row{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:56px}
.hdr .logo{flex:0 0 auto;height:38px;width:38px;display:block;background:#fff;border-radius:9px;padding:3px}
.hdr .back{flex:0 0 auto;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);border-radius:10px;padding:10px 12px;font-weight:600;min-height:44px}
.hdr .ttl{flex:1 1 auto;min-width:0}
.hdr .updbar{display:flex;justify-content:flex-end;padding:4px 12px 0}
.hdr .upd{border:1.5px solid #fff;border-radius:6px;padding:1px 8px;font-size:11px;line-height:1.35;font-weight:700;letter-spacing:.3px;white-space:nowrap;background:rgba(255,255,255,.14)}
.hdr .upd i{font-style:normal;font-weight:400;margin-left:4px}
.hdr .ttl .t1{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl .t2{font-size:12.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .stripe{height:5px;width:100%;background:var(--nf2)}
.wrap{padding:12px 12px 28px 12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px 0}
.card h2{font-size:15px;margin:0 0 8px 0;color:var(--nf);text-transform:uppercase;letter-spacing:.03em}
.card h2 small{display:block;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);font-size:12.5px}
.title-card{background:var(--nf);color:#fff;border:0}
.title-card .big{font-size:21px;font-weight:800;line-height:1.2}
.title-card .sub{font-size:13.5px;opacity:.95;margin-top:6px}
.title-card .meta{font-size:12px;opacity:.85;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:#fff;border:2px solid var(--line);border-left:8px solid var(--nf2);border-radius:12px;padding:12px;min-height:104px;text-align:left;box-shadow:0 1px 2px rgba(7,58,133,.08)}
.sbtn:active{background:var(--soft)}
.sbtn .ic{font-size:24px;font-weight:800;color:var(--nf);line-height:1}
.sbtn .n{font-weight:800;font-size:17px;color:var(--nfd)}
.sbtn .b{font-size:12px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--nf2);color:#fff;border-radius:12px;padding:13px 14px;font-weight:700;min-height:48px;width:100%;text-align:center}
.btn.sec{background:#fff;color:var(--nf);border:2px solid var(--nf2)}
.btn:active{filter:brightness(.92)}
.viewer{position:relative;width:100%;height:58vh;min-height:300px;background:#dbe6f5;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;user-select:none}
.viewer.tall{height:88vh !important}
.viewer img{position:absolute;left:0;top:0;user-select:none;-webkit-user-drag:none;pointer-events:none;max-width:none}
.viewer .tiles{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.viewer .tapwrap{position:absolute;left:0;top:0;pointer-events:none}
.viewer .tapwrap .tap{position:absolute;pointer-events:auto;border:calc(var(--u)*7) solid #073a85;border-radius:calc(var(--u)*10);padding:0;margin:0;box-sizing:border-box;text-align:left;cursor:pointer}
.viewer .tapwrap .tap.pt{border:0!important;background:none!important;width:0!important;height:0!important;pointer-events:none}.viewer .tapwrap .tap.pt span{left:0;top:0;transform:translate(-50%,-50%);border-radius:calc(var(--u)*14);white-space:nowrap;box-shadow:0 0 0 calc(var(--u)*4) #fff}
.viewer .tapwrap .tap.sm span{font-size:calc(var(--u)*9);padding:calc(var(--u)*2) calc(var(--u)*4);border-width:calc(var(--u)*1.5);border-radius:calc(var(--u)*5);box-shadow:none;background:#fff8c4}
.viewer .tapwrap .tap span{position:absolute;left:calc(var(--u)*-7);top:calc(var(--u)*-7);background:#fff;font-weight:900;font-size:calc(var(--u)*56);line-height:1.1;padding:calc(var(--u)*6) calc(var(--u)*18);border-radius:calc(var(--u)*10) 0 calc(var(--u)*14) 0;border:calc(var(--u)*5) solid currentColor}
.viewer .ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:5}
.viewer .ctl button{width:44px;height:44px;border-radius:10px;background:var(--nf);color:#fff;font-size:20px;font-weight:700;box-shadow:0 1px 4px rgba(7,58,133,.4)}
.viewer .ctl button.wide{width:auto;padding:0 12px;font-size:13px}
.viewer .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#243b5a;font-weight:600;background:#dbe6f5}
.tabs{display:flex;gap:6px;margin:0 0 8px 0;flex-wrap:wrap}
.tab{flex:1 1 auto;min-height:40px;border-radius:10px;border:2px solid var(--nf2);color:var(--nf);font-weight:700;padding:6px 10px;background:#fff}
.tab.on{background:var(--nf2);color:#fff}
.item{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-left:8px solid var(--nf2);border-radius:12px;padding:10px;margin:0 0 10px 0;box-shadow:0 1px 2px rgba(7,58,133,.06);width:100%;text-align:left}
.item:active{background:var(--soft)}
.item .body{flex:1 1 auto;min-width:0}
.item .id{font-weight:800;font-size:16px;color:var(--nfd)}
.item .nm{font-size:13px;color:var(--muted);margin-top:1px}
.item .rev{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--nf);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.item .rev.flag{background:var(--nf);color:#fff;border-color:var(--nf)}
.item .go{flex:0 0 auto;align-self:center;font-size:22px;color:var(--nf2);font-weight:800}
.fam{font-size:13px;font-weight:800;color:var(--nf);margin:14px 2px 6px 2px;text-transform:uppercase;letter-spacing:.03em}
.fam:first-child{margin-top:0}
.nav2{display:flex;gap:10px;margin-top:4px}
.nav2 .btn{flex:1 1 0}
.hint{font-size:12.5px;color:var(--muted);margin:8px 2px 0 2px}
.meta2{font-size:12.5px;color:var(--muted);margin:2px 0 8px 0;word-break:break-word}
.pend{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:2px dashed var(--nf2);border-radius:10px;margin:0 0 8px 0;background:var(--soft)}
.pend b{color:var(--nfd)}
.pend span.es{display:block;color:var(--muted);font-size:12.5px}
.tag{flex:0 0 auto;font-size:11px;font-weight:800;color:#fff;background:var(--nf);border-radius:6px;padding:2px 7px;margin-top:1px}
.foot{font-size:11.5px;color:var(--muted);text-align:center;margin:12px 0 0 0}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0)) 8px;gap:4px}
.bottombar button{flex:1 1 0;min-height:48px;border-radius:10px;font-weight:700;font-size:12.5px;color:var(--nf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.bottombar button.on{background:var(--soft)}
.bottombar button span{font-size:10.5px;font-weight:500;color:var(--muted)}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}

.inst{background:#fff;border:3px solid var(--nf);border-radius:16px;padding:14px;margin:12px 0}
.inst .ibtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--nf);color:#fff;border:0;border-radius:14px;padding:16px 12px;font-size:19px;font-weight:800;min-height:58px;cursor:pointer}
.inst .ibtn small{display:block;font-size:13px;font-weight:600;opacity:1}
.inst .ibtn:active{filter:brightness(.9)}
.inst .ok{background:var(--soft);color:var(--nfd);border:2px solid var(--nf2);border-radius:12px;padding:12px;font-weight:800;text-align:center}
.inst .steps{display:none;margin-top:12px;background:var(--soft);border-radius:12px;padding:12px;color:var(--txt);font-size:15px;line-height:1.45}
.inst .steps.show{display:block}
.inst .steps b{color:var(--nfd)}
.inst .steps ol{margin:6px 0 8px 20px;padding:0}
.inst .steps .es{color:var(--muted);display:block;margin-bottom:6px}
.inst .cp{margin-top:10px;width:100%;background:#fff;color:var(--nf);border:2px solid var(--nf2);border-radius:12px;padding:12px;font-weight:700;font-size:15px;min-height:46px;cursor:pointer}
.inst .why{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}

.hbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:var(--nf);border:3px solid var(--nf);border-radius:14px;padding:13px 12px;font-size:17px;font-weight:800;min-height:54px;cursor:pointer;margin:0 0 12px 0}
.hbtn small{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.hbtn:active{filter:brightness(.93)}
.how .st{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px 0}
.how .st .hd{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.how .st .num{flex:0 0 38px;height:38px;border-radius:50%;background:var(--nf);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.how .st .t{font-weight:800;font-size:17px;color:var(--nfd);line-height:1.15}
.how .st .t small{display:block;font-weight:600;font-size:13px;color:var(--muted)}
.how .st p{margin:6px 0;font-size:14.5px;line-height:1.4;color:var(--txt)}
.how .st p i{color:var(--muted)}
.how .st img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin-top:8px}
.how .air{background:var(--soft);border:2px dashed var(--nf2);border-radius:12px;padding:14px;text-align:center;margin-top:8px;font-weight:800;color:var(--nfd);font-size:16px}
.how .air span{display:block;font-size:34px;line-height:1.1}

/* update 2 */
.hdr .upd{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;min-height:30px;cursor:pointer;font-size:12px}
.hdr .upd:active{background:rgba(255,255,255,.3)}
.hdr .updbar{padding-bottom:2px}
.vdot{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid #fff;background:#facc15;flex:0 0 auto}
.vdot.g{background:#22c55e}.vdot.r{background:#ef4444}
.lvb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-left:8px solid var(--nf2);border-radius:14px;padding:10px 12px;margin:0 0 10px 0;min-height:70px;box-shadow:0 1px 2px rgba(7,58,133,.08)}
.lvb:active{background:var(--soft)}
.lvb .num{flex:0 0 52px;height:52px;border-radius:12px;background:var(--nf);color:#fff;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center}
.lvb .tx{flex:1 1 auto;min-width:0}
.lvb .n{font-weight:800;font-size:17px;color:var(--nfd)}
.lvb .b{font-size:12.5px;color:var(--muted)}
.lvb .go{font-size:24px;color:var(--nf2);font-weight:800}
.lvb.empty .num{background:#fff;color:var(--nf);border:2px dashed var(--nf2)}
.typebar{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.typebar button{flex:1 1 auto;min-height:44px;border:2px solid var(--nf2);border-radius:10px;color:var(--nf);font-weight:700;background:#fff;padding:6px 10px;font-size:14px}
.slot{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin:0 0 12px 0}
.slot .sh{display:flex;align-items:center;gap:8px;margin:0 0 8px 0}
.slot .s1{flex:1 1 auto;font-weight:800;font-size:16px;color:var(--nfd);line-height:1.15}
.slot .s1 small{display:block;font-weight:600;font-size:12.5px;color:var(--muted)}
.bdg{flex:0 0 auto;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px}
.bdg.ok{background:var(--nf);color:#fff}
.bdg.pe{background:#fff;color:var(--nf);border:2px dashed var(--nf2)}
.lvit{border:1px solid var(--line);border-left:8px solid var(--nf2);border-radius:12px;margin:0 0 8px 0;background:#fff;overflow:hidden}
.lvit .item{border:0;border-radius:0;margin:0;box-shadow:none;border-left:0}
.lvit .all{display:inline-block;margin-top:6px;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--nfd);background:#fff;border:1px solid var(--nf2);border-radius:999px;padding:2px 9px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 10px 10px 10px}
.chips span{flex:0 0 100%;font-size:12px;font-weight:700;color:var(--muted)}
.chip{min-height:40px;min-width:48px;border-radius:10px;border:2px solid var(--nf2);color:var(--nf);font-weight:800;padding:4px 12px;background:#fff;font-size:14px}
.chip:active{background:var(--soft)}
.vstat{border:3px solid var(--nf);border-radius:16px;padding:14px;background:#fff;margin:0 0 12px 0}
.vstat .big{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--nfd)}
.vstat .big .vdot{width:22px;height:22px;border-width:3px;border-color:var(--nfd)}
.vstat p{margin:8px 0 0 0;font-size:14px;color:var(--txt)}
.vstat p i{color:var(--muted)}
.vstat .ubtn{margin-top:12px;display:block;width:100%;background:var(--nf);color:#fff;border-radius:12px;padding:14px;font-weight:800;font-size:16px;min-height:52px}
.vstat .ubtn:disabled{opacity:.7}
.vkey{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:13px;color:var(--txt)}
.vkey div{display:flex;align-items:center;gap:8px}
.vkey .vdot{border-color:var(--nfd)}
.vrow{background:#fff;border:1px solid var(--line);border-left:8px solid var(--nf2);border-radius:12px;padding:10px;margin:0 0 10px 0}
.vrow.cur{border-left-color:var(--nf);background:var(--soft)}
.vrow .vh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vrow .vn{font-weight:800;font-size:16px;color:var(--nfd)}
.vrow .vd{font-size:12.5px;color:var(--muted)}
.vrow .me{font-size:11px;font-weight:800;color:#fff;background:var(--nf);border-radius:6px;padding:2px 7px}
.vrow ul{margin:6px 0 0 18px;padding:0;font-size:13.5px}
.vrow li i{color:var(--muted)}

.jump{display:flex;gap:8px;margin:0 0 12px 0;position:sticky;top:0;z-index:5}
.jump button{flex:1 1 0;min-height:52px;border-radius:12px;background:var(--nf2);color:#fff;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(7,58,133,.35)}
.jump button span{font-size:11px;font-weight:500;opacity:.95}
.plan{position:relative;width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.plan img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.plan img.zov{position:absolute;left:0;top:0;pointer-events:none}
.plan .lbl{position:absolute;transform:translate(-50%,-50%);background:#fff;border:3px solid #333;border-radius:999px;padding:5px 10px;font-weight:800;font-size:13px;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.3);white-space:nowrap;min-height:34px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:600;background:#f7f8fa;color:#223;min-height:30px}
.pill .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.psb{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;min-height:64px;text-align:left;box-shadow:0 1px 2px rgba(7,58,133,.08)}
.psb:active{background:var(--soft)}
.psb .sw{flex:0 0 auto;width:16px;height:40px;border-radius:5px}
.psb .n{font-weight:800;font-size:17px;color:var(--nfd)}
.psb .b{font-size:12px;color:var(--muted)}
.chip.on{background:var(--nf);color:#fff}
.psb .st{margin-left:auto;font-weight:800;font-size:17px}
.psb.ok{border-color:#1c8a43}.psb.ok .st{color:#1c8a43}.psb.pe{border-color:#c0392b;background:#fdeceb}.psb.pe .st{color:#c0392b}
.mrow{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px 0;text-align:left;min-height:64px;box-shadow:0 1px 2px rgba(7,58,133,.08)}
.mrow:active{background:var(--soft)}
.mrow .ic{flex:0 0 auto;width:58px;height:58px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:32px;padding:4px}.mrow .ic svg{width:100%;height:100%}
.mrow .tt{flex:1 1 auto}.mrow .t{font-weight:800;font-size:16px;color:var(--nfd)}.mrow .u{font-size:12.5px;color:var(--muted);margin-top:2px}
.mrow .go{font-size:22px;color:var(--nf)}
.utg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.utb{min-height:62px;border-radius:12px;border:2px solid var(--nf2);background:#fff;padding:8px 10px;text-align:left}.utb b{display:block;font-size:19px;font-weight:800;color:var(--nfd)}.utb span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.mrow.pe{background:#f4f6f9;border-style:dashed;cursor:default}.mrow.pe .t{color:#4a5d78}
.pgrid.c4{grid-template-columns:repeat(4,1fr);gap:8px}.pgrid.c4 .psb{min-height:46px;padding:8px;justify-content:center;gap:4px;border-radius:12px;background:#fff}
.pgrid.c4 .psb .sw,.pgrid.c4 .psb .b{display:none}.pgrid.c4 .psb .n{font-size:16px}.pgrid.c4 .psb .st{margin-left:4px;font-size:15px}
.lvb.flat .b{display:none}
.plist{display:flex;flex-direction:column;gap:12px;margin:0 0 14px 0}
.slogo{display:flex;justify-content:center;margin:6px 0 22px 0}.slogo img{height:170px;width:auto;border-radius:16px;background:#fff}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;width:100%;min-height:76px;border-radius:14px;padding:10px 18px;background:var(--nf);color:#fff;text-align:left;box-shadow:0 1px 3px rgba(7,58,133,.25)}
.pbtn b{font-size:24px;line-height:1.1}.pbtn small{font-size:14px;margin-top:3px}
.pbtn.off{background:#fff;color:#4a5d78;border:2px dashed var(--nf2);box-shadow:none;min-height:76px;cursor:default}.pbtn.off b{font-size:20px}
.slot .sh .ic{flex:0 0 auto;width:40px;height:40px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px}
.qrc{text-align:center}.qrc img{width:200px;height:200px;image-rendering:pixelated;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff}
.qrc .u{font-size:13px;font-weight:700;color:var(--nfd);margin-top:6px;word-break:break-all}

 por sección (5A/5B, 4D, 4C, 4B, 4A, 3C, 3B, 3A) abren la hoja acercada a esa sección, niveles 3-7."]]}, {"v": "7.3", "n": 19, "date": "Nov 15, 2026", "items": [["Control Lines on a level page now opens the plan directly (no extra list).", "Control Lines en la página del nivel ahora abre el plano directo (sin lista intermedia)."]]}, {"v": "7.2", "n": 18, "date": "Nov 15, 2026", "items": [["UPDATE button redesigned like the Floor app: full-width bar, green = up to date, red = new version available.", "Botón UPDATE rediseñado como en la app de Floor: barra ancha, verde = actualizada, roja = hay versión nueva."]]}, {"v": "7.1", "n": 17, "date": "Nov 15, 2026", "items": [["Sharper plans when you zoom in: Control Lines, Wall Layout, Shear Wall/Sole Plates, Straps, Posts, 3rd/6th/7th Floor Overall and all Millwork sheets re-rendered at much higher resolution.", "Planos más nítidos al hacer zoom: Control Lines, Wall Layout, Sole Plates, Straps, Posts, Overall de 3er/6to/7mo piso y todo el Millwork con mucha más resolución."]]}, {"v": "7.0", "n": 16, "date": "Nov 15, 2026", "items": [["New, larger icons: Control Lines (red grid), Shear Walls (sheathed wall with nails), Straps (Simpson strap with holes), Balcony Posts (square wood post), Millwork (cabinets).", "Íconos nuevos y más grandes: Control Lines, Shear Walls, Straps, Balcony Posts y Millwork."]]}, {"v": "6.9", "n": 15, "date": "Nov 15, 2026", "items": [["Delivery Schedule button: larger truck icon.", "Botón Delivery Schedule: camión más grande."]]}, {"v": "6.8", "n": 14, "date": "Nov 14, 2026", "items": [["RFI's loaded: 6 wall RFIs (#06, #07, #08, #09, #12, #24) with question and response.", "RFI's cargados: 6 RFIs de paredes (#06, #07, #08, #09, #12, #24) con pregunta y respuesta."]]}, {"v": "6.7", "n": 13, "date": "Nov 14, 2026", "items": [["RFI's button now opens the RFIs for that section, each with its question and the response (shows 'None posted' until RFIs are loaded).", "El botón RFI's ahora abre los RFIs de esa sección, cada uno con su pregunta y su respuesta (dice 'None posted' hasta que se carguen RFIs)."]]}, {"v": "6.6", "n": 12, "date": "Nov 14, 2026", "items": [["RFI's and Repairs buttons inside every section now use the RFI icon (same as the floor app).", "Los botones RFI's y Repairs dentro de cada sección ahora usan el ícono RFI (igual que la app de pisos)."]]}, {"v": "6.5", "n": 11, "date": "Nov 14, 2026", "items": [["New buttons on every level page: RFI's and Repairs (nothing posted yet).", "Botones nuevos en cada página de nivel: RFI's y Repairs (todavía no hay nada publicado)."]]}, {"v": "6.4", "n": 10, "date": "Nov 14, 2026", "items": [["Delivery Schedule page is now English only.", "La página Delivery Schedule ahora está solo en inglés."]]}, {"v": "6.3", "n": 9, "date": "Nov 14, 2026", "items": [["New button on page 2: Delivery Schedule (wall panel deliveries by date, filter by level).", "Botón nuevo en la página 2: Delivery Schedule (entregas de paneles por fecha, filtro por nivel)."]]}, {"v": "6.2", "n": 8, "date": "Nov 14, 2026", "items": [["Level 3 Millwork replaced with Beto's new sheets (11-12): block (2)2x6 added for the AC, nominal lumber instead of the metal plate. Sections 3A/3B/3C, 4A/4B, 4C/4D, 5A/5B. Sheet order changed.", "Millwork del nivel 3 reemplazado con las hojas nuevas de Beto (11-12): se agregó el bloque (2)2x6 para el AC, madera nominal en lugar de la placa de metal. Secciones 3A/3B/3C, 4A/4B, 4C/4D, 5A/5B. Cambió el orden de las hojas."]]}, {"v": "6.1", "n": 7, "date": "Nov 14, 2026", "items": [["Bottom bar removed on every page. Use the Back button under the blue bar.", "Se quitó la barra de abajo en todas las páginas. Usa el botón Atrás debajo de la barra azul."]]}, {"v": "6.0", "n": 6, "date": "Nov 14, 2026", "items": [["New first page: Projects (Mueller + 3 coming up), Download app and How it works. All blue.", "Nueva primera página: Proyectos (Mueller + 3 próximamente), Descargar app y Cómo funciona. Todo azul."], ["Page 2: Levels 3–7 and a QR code to share the app. Update button (green / red dot) sits under the blue bar.", "Página 2: Niveles 3–7 y código QR para compartir la app. El botón Update (punto verde / rojo) queda debajo de la barra azul."], ["Page 3: one big button per format with its icon: Control Lines, Layouts, Shear Walls, Straps, Balcony Posts, Millwork.", "Página 3: un botón grande por formato con su ícono: Control Lines, Layouts, Shear Walls, Straps, Balcony Posts, Millwork."], ["Download app: clear step-by-step for iPhone and Android.", "Descargar app: pasos claros para iPhone y Android."], ["New: Layout (Overall) for levels 6 and 7, IFC 10.16.26 (from Beto).", "Nuevo: Layout (Overall) de los niveles 6 y 7, IFC 10.16.26 (de Beto)."]]}, {"v": "5.0", "n": 5, "date": "Nov 13, 2026", "items": [["Level page: plan first, tap a section (zone or button). Buttons show a check when the level has its wall layout, an hourglass when pending. Same look as the floor truss app.", "Página de nivel: primero el plano, toca una sección (zona o botón). Los botones muestran palomita si el nivel ya tiene su layout de muros, reloj de arena si está pendiente."], ["New section menu page (like the floor truss app): Wall layout, Control lines, Shear walls, Straps, Balcony posts, Millwork… each as a row. The layout opens zoomed on the section; Back returns to the menu.", "Nueva página de menú de la sección: Wall layout, Control lines, Shear walls, Straps, Balcony posts, Millwork… cada uno en un renglón. El layout abre acercado en la sección; Atrás regresa al menú."], ["Bottom bar on level and section pages shows only Home and the current level. Pages 2-4 are English only. Source and date line under the plan.", "La barra de abajo en nivel y sección muestra solo Home y el nivel actual. Páginas 2-4 solo en inglés. Línea de fuente y fecha bajo el plano."]]}, {"v": "4.0", "n": 4, "date": "Nov 10, 2026", "items": [["New level page, same format as the floor truss app: FULL PLAN (tap a section) · SECTIONS buttons · FORMATS.", "Nueva página de nivel, mismo formato que la app de floor truss: PLANO COMPLETO (toca una sección) · botones de SECCIONES · FORMATOS."], ["New section page: the Wall Layout sheet opens zoomed on that section, with buttons to jump to the other sections.", "Nueva página de sección: la hoja Wall Layout abre acercada en esa sección, con botones para saltar a las otras secciones."], ["Level 3: each section links to its Millwork sheets.", "Nivel 3: cada sección enlaza a sus hojas de Millwork."], ["Section zones follow the floor truss section map (3A–5A/5B); edges are approximate on the wall sheets until Beto confirms the sections.", "Las zonas de sección siguen el mapa de secciones de floor truss (3A–5A/5B); los bordes son aproximados en las hojas de muros hasta que Beto confirme las secciones."]]}, {"v": "3.0", "n": 3, "date": "Nov 9, 2026", "items": [["Beto's package (10-29-2026): Control Lines and Wall Layout for levels 3–7.", "Paquete de Beto (10-29-2026): Control Lines y Wall Layout de los niveles 3–7."], ["Sole Plates levels 3–7 (flagged until the sill plate is approved).", "Sole Plates niveles 3–7 (marcadas hasta que se apruebe el sill plate)."], ["Window Straps for all levels, with install detail and two examples (replaces the level-3-only sheet).", "Straps de ventanas de todos los niveles, con detalle de instalación y dos ejemplos (reemplaza la hoja solo del nivel 3)."], ["New: Balcony Posts (all levels).", "Nuevo: Postes de balcón (todos los niveles)."], ["New: Millwork for level 3, by section (key plan, section plan, unit sheets).", "Nuevo: Millwork del nivel 3, por sección (plano clave, plano de sección, hojas por unidad)."]]}, {"v": "2.0", "n": 2, "date": "Nov 9, 2026", "items": [["Home now has Level 3–7 buttons; each level shows its formats.", "Inicio con botones de Nivel 3–7; cada nivel muestra sus formatos."], ["Full plan plus section buttons under each sheet.", "Plano completo y botones de sección debajo de cada hoja."], ["Version button (top right) with green / yellow / red dot.", "Botón de versión (arriba a la derecha) con punto verde / amarillo / rojo."], ["Window straps: install detail tab (level 3).", "Straps de ventanas: pestaña de detalle de instalación (nivel 3)."], ["Control lines and wall layout: section buttons are marked PENDING until the section sheets arrive.", "Líneas de control y layout de muros: los botones de sección dicen PENDING hasta que lleguen las hojas por sección."]]}, {"v": "1.2", "n": 1, "date": "Nov 7, 2026", "items": [["HOW IT WORKS page (5 steps).", "Página CÓMO FUNCIONA (5 pasos)."]]}, {"v": "1.1", "n": 1, "date": "Nov 7, 2026", "items": [["DOWNLOAD APP button.", "Botón DESCARGAR APP."]]}, {"v": "1.0", "n": 1, "date": "Nov 6, 2026", "items": [["First release: Control Lines, Layouts, Shear Walls, Straps (West, latest only).", "Primera versión: Control Lines, Layouts, Shear Walls, Straps (West, solo lo más reciente)."]]}]};

const RFIS=[{"no": "RFI #06", "t": "Simpson SCB4.3 clips at CMU (stairs/elevators)", "date": "Jul 22, 2026", "st": "Answered", "lv": [3, 4, 5, 6, 7], "secs": [], "q": "Detail 13/SD3-2 (exterior walls at CMU, stairs and elevators) calls for a Simpson SCB4.3 clip at every stud, 16\" O.C. The prefab panels arrived with plywood already installed, which blocks the hardware. Only option: cut the plywood, install the clips, re-install the cut piece. How should NF proceed?", "a": "Sheathing can be left off future walls (AMLI coordinating with R&N to have it removed). The clips still need to be installed. NF noted the work from a scissor lift or the crawler used for windows.", "by": "Jamie Kyler, AMLI", "adate": "Jul 22, 2026"}, {"no": "RFI #07", "t": "CMU slip connection vs. shear block", "date": "Jul 22, 2026", "st": "Referred to structural", "lv": [3, 4, 5, 6, 7], "secs": [], "q": "Detail 4/SD3-2 (CMU slip connection): the shear blocking between floor trusses interferes with the slip connection as drawn (diagonal bracing conflicts with the 2x6 scab). This detail is at most elevators and stairwells in the West building. Guidance requested.", "a": "AMLI: a different style of shear block is being worked on for the plumbing areas to reduce repairs. NF suggested moving the slip hardware; AMLI asked for the vertical O.C. and pointed to the structural drawings, SD3-2 #13. The O.C. question goes to the Engineer of Record.", "by": "Jamie Kyler, AMLI", "adate": "Jul 27, 2026"}, {"no": "RFI #08", "t": "Panel E227 balcony corner support, Unit 312 (C7a)", "date": "Jul 25, 2026", "st": "Answered", "lv": [3], "secs": [], "q": "At Unit 312 a 5\" wall projection extends beyond the wall below. It supports the end of the balcony wood beam while the outside corner looks unsupported. Does AMLI want added support under the projection, or is the drawn condition intended?", "a": "Per the structural plans for unit C7a, the 5\" bump-out does not carry structural load. A few extra metal shims under
